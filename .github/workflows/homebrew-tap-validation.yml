name: Homebrew Tap Validation

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'
  pull_request:
    paths:
      - 'Formula/**'
  workflow_dispatch:

jobs:
  validate-formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          brew tap-new local/quark
          cp Formula/quark.rb /opt/homebrew/Library/Taps/local/homebrew-quark/Formula/
          brew trust local/quark

      - name: Run brew audit on formula
        run: |
          brew audit --strict local/quark/quark

      - name: Test formula syntax
        run: |
          brew formula local/quark/quark
